
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.A Mega Store</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101010;
  color:white;
}
header{
  background:#080808;
  padding:18px 12px;
  text-align:center;
  border-bottom:2px solid #d4af37;
}
.logo{
  color:#d4af37;
  font-size:27px;
  font-weight:bold;
}
header p{color:#ccc;margin:7px 0 0}
.search{
  width:92%;
  padding:13px;
  margin:18px 4%;
  border-radius:8px;
  border:1px solid #d4af37;
  background:#222;
  color:white;
  font-size:15px;
}
.categories{
  display:flex;
  overflow-x:auto;
  gap:9px;
  padding:5px 12px 15px;
}
.categories button{
  background:#222;
  color:#d4af37;
  border:1px solid #d4af37;
  padding:11px 16px;
  border-radius:20px;
  white-space:nowrap;
}
.categories button.active{
  background:#d4af37;
  color:black;
}
h2{
  color:#d4af37;
  padding-left:14px;
}
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  padding:12px;
}
.card{
  background:#202020;
  border:1px solid #444;
  border-radius:12px;
  overflow:hidden;
}
.card img{
  width:100%;
  height:145px;
  object-fit:cover;
}
.card h3{
  font-size:15px;
  margin:10px;
}
.price{
  color:#d4af37;
  font-weight:bold;
  margin:10px;
}
.card button{
  width:90%;
  margin:5px 5% 12px;
  padding:10px;
  background:#d4af37;
  color:black;
  border:0;
  border-radius:7px;
  font-weight:bold;
}
.cart{
  margin:15px 12px;
  padding:15px;
  background:#202020;
  border:1px solid #d4af37;
  border-radius:12px;
}
.cart h2{padding:0}
.cart-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #444;
}
.cart button,.checkout{
  background:#d4af37;
  color:black;
  border:0;
  padding:10px;
  border-radius:6px;
  font-weight:bold;
}
footer{
  text-align:center;
  padding:25px;
  color:#aaa;
  border-top:1px solid #d4af37;
}
</style>
</head>

<body>

<header>
  <div class="logo">M.A MEGA STORE</div>
  <p>Everything You Need, In One Place</p>
</header>

<input class="search" id="search"
placeholder="Search products..."
oninput="showProducts()">

<div class="categories">
  <button class="active" onclick="filter('All',this)">All</button>
  <button onclick="filter('Bike Accessories',this)">Bike Accessories</button>
  <button onclick="filter('Clothes',this)">Clothes</button>
  <button onclick="filter('Shoes',this)">Shoes</button>
</div>

<h2>Our Products</h2>
<div class="products" id="products"></div>

<div class="cart">
  <h2>🛒 My Shopping Cart</h2>
  <div id="cartItems">Your cart is empty.</div>
  <h3 id="total">Total: Rs. 0</h3>
  <button class="checkout" onclick="checkout()">
    Place Order
  </button>
</div>

<footer>
  <p>© 2026 M.A Mega Store</p>
  <p>Thank you for shopping with us!</p>
</footer>

<script>
const items = [
 {
  name:"Bike Gloves",
  category:"Bike Accessories",
  price:850,
  image:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500"
 },
 {
  name:"Bike Helmet",
  category:"Bike Accessories",
  price:2500,
  image:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500"
 },
 {
  name:"Men T-Shirt",
  category:"Clothes",
  price:1200,
  image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
 },
 {
  name:"Casual Shirt",
  category:"Clothes",
  price:1800,
  image:"https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=500"
 },
 {
  name:"Sports Shoes",
  category:"Shoes",
  price:3200,
  image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
 },
 {
  name:"Casual Sneakers",
  category:"Shoes",
  price:2800,
  image:"https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=500"
 }
];

let selected="All";
let cart=[];

function filter(category,button){
 selected=category;
 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 showProducts();
}

function showProducts(){
 let search=document.getElementById("search")
 .value.toLowerCase();

 let result=items.filter(p=>
 (selected==="All"||p.category===selected)&&
 p.name.toLowerCase().includes(search)
 );

 document.getElementById("products").innerHTML=
 result.map(p=>`
 <div class="card">
 <img src="${p.image}" alt="${p.name}">
 <h3>${p.name}</h3>
 <div class="price">Rs. ${p.price}</div>
 <button onclick="addCart('${p.name}')">
 Add to Cart
 </button>
 </div>
 `).join("")||"<p>No products found.</p>";
}

function addCart(name){
 let p=items.find(x=>x.name===name);
 let existing=cart.find(x=>x.name===name);
 if(existing){
  existing.qty++;
 }else{
  cart.push({...p,qty:1});
 }
 showCart();
}

function showCart(){
 let html="";
 let total=0;

 cart.forEach((p,i)=>{
  total+=p.price*p.qty;
  html+=`
  <div class="cart-item">
  <span>${p.name} × ${p.qty}</span>
  <span>Rs. ${p.price*p.qty}
  <button onclick="removeItem(${i})">X</button></span>
  </div>`;
 });

 document.getElementById("cartItems").innerHTML=
 html||"Your cart is empty.";

 document.getElementById("total").innerText=
 "Total: Rs. "+total;
}

function removeItem(i){
 cart.splice(i,1);
 showCart();
}

function checkout(){
 if(cart.length===0){
  alert("Your cart is empty!");
  return;
 }
 let message="Hello M.A Mega Store! My order:\n";
 cart.forEach(p=>{
  message+=p.name+" x "+p.qty+
  " = Rs. "+p.price*p.qty+"\n";
 });
 let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
 message+="Total: Rs. "+total;

 alert("Your order details:\n\n"+message+
 "\n\nWhatsApp ordering will be activated in the next step.");
}

showProducts();
</script>

</body>
  </html>
